name: Deploy to Staging (Plesk)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Connect and diff, but upload nothing'
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/web-app/browser/index.html
          test -f dist/web-app/browser/main.js
          test -f dist/web-app/browser/web.config
          echo "main.js  $(sha256sum dist/web-app/browser/main.js | cut -c1-16)"

      - name: Deploy to Plesk over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.PLESK_HOST }}
          username: ${{ secrets.PLESK_USER }}
          password: ${{ secrets.PLESK_PASSWORD }}
          protocol: ftps
          port: 21
          # The Plesk FTPS service presents a self-signed certificate, so strict
          # CA validation can never succeed against it. Traffic stays encrypted;
          # what is given up is authentication of the server. Accepted knowingly.
          # To harden: assign a real cert to the FTP service in Plesk
          # (Tools & Settings > SSL/TLS Certificates), then switch this to strict.
          security: loose
          local-dir: ./dist/web-app/browser/
          # coopmis.dibugsoft.com is a subdomain of the dibugsoft.com
          # subscription, and DbugHost's FTP home is the webspace root shared by
          # 169 domains. This path is the document root of THIS site only --
          # /httpdocs/ would overwrite the parent dibugsoft.com website.
          server-dir: /coopmis.dibugsoft.com/
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run == true }}
          exclude: |
            **/assets/env.js
            **/.git*
            **/.git*/**

      - name: Verify the deployed build is live
        if: inputs.dry_run != true
        run: |
          expected=$(sha256sum dist/web-app/browser/main.js | cut -d' ' -f1)
          live=$(curl -fsS --retry 3 --retry-delay 5 https://coopmis.dibugsoft.com/main.js | sha256sum | cut -d' ' -f1)
          echo "expected: ${expected:0:16}"
          echo "live:     ${live:0:16}"
          if [ "$expected" != "$live" ]; then
            echo "::error::Deployed main.js does not match the build. The upload did not land."
            exit 1
          fi
