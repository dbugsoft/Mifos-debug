<div class="product-view">
  <!-- Tabs only earn their space when there is more than the General tab. -->
  @if (fixedDepositDatatables?.length) {
    <nav mat-tab-nav-bar class="navigation-tabs" [tabPanel]="tabPanel">
      <a
        mat-tab-link
        [routerLink]="['./general']"
        routerLinkActive
        #general="routerLinkActive"
        [active]="general.isActive"
      >
        {{ 'labels.heading.General' | translate }}
      </a>
      @for (fixedDepositDatatable of fixedDepositDatatables; track fixedDepositDatatable) {
        <a
          mat-tab-link
          [routerLink]="['./datatables', fixedDepositDatatable.registeredTableName]"
          routerLinkActive
          #datatable="routerLinkActive"
          [active]="datatable.isActive"
          *mifosxHasPermission="'READ_' + fixedDepositDatatable.registeredTableName"
        >
          {{ fixedDepositDatatable.registeredTableName }}
        </a>
      }
    </nav>

    <mat-tab-nav-panel #tabPanel>
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  } @else {
    <router-outlet></router-outlet>
  }
</div>
