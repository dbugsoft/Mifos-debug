<div class="container">
  <div class="list-toolbar">
    <div class="toolbar-left">
      <mat-form-field class="search-field" appearance="outline" subscriptSizing="dynamic">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [placeholder]="'labels.inputs.Filter' | translate" (keyup)="applyFilter($event.target.value)" />
      </mat-form-field>
    </div>
    <div #buttonCreateDelinquencyRange class="toolbar-right" *mifosxHasPermission="'CREATE_DELINQUENCY_BUCKET'">
      <button mat-raised-button color="primary" [matMenuTriggerFor]="createMenu">
        <fa-icon icon="plus" class="btn-icon"></fa-icon>{{ 'labels.buttons.Create' | translate }}
        <fa-icon icon="caret-down" class="m-l-10"></fa-icon>
      </button>
      <mat-menu #createMenu="matMenu" xPosition="before" class="create-bucket-menu">
        <button mat-menu-item [routerLink]="['create']" [queryParams]="{ bucketType: 'regular' }">
          <span class="menu-icon"><fa-icon icon="calendar-alt"></fa-icon></span>
          {{ 'labels.catalogs.Regular' | translate }} {{ 'labels.inputs.Delinquency Bucket' | translate }}
        </button>
        <button mat-menu-item [routerLink]="['create']" [queryParams]="{ bucketType: 'workingcapital' }">
          <span class="menu-icon"><fa-icon icon="money-bill-alt"></fa-icon></span>
          {{ 'labels.catalogs.Working Capital' | translate }} {{ 'labels.inputs.Delinquency Bucket' | translate }}
        </button>
      </mat-menu>
    </div>
  </div>

  <div>
    <table mat-table [dataSource]="dataSource" matSort class="members-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Name' | translate }}</th>
        <td mat-cell *matCellDef="let delinquencyBucket" class="name-cell">{{ delinquencyBucket.name }}</td>
      </ng-container>
      <ng-container matColumnDef="bucketType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'labels.inputs.Type' | translate }}</th>
        <td mat-cell *matCellDef="let delinquencyBucket">
          {{ bucketTypeLabel(delinquencyBucket.bucketType.id) | translateKey: 'catalogs' }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [routerLink]="[row.id]"
        [queryParams]="{ bucketType: bucketType(row.bucketType.id) }"
        class="select-row"
      ></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
  </div>
</div>
