<div class="container">
  <div class="page-actions">
    <button mat-raised-button color="primary" [routerLink]="['edit']" *mifosxHasPermission="'UPDATE_DELINQUENCY_RANGE'">
      <fa-icon icon="edit" class="m-r-10"></fa-icon>
      {{ 'labels.buttons.Edit' | translate }}
    </button>
    <button
      mat-raised-button
      color="warn"
      (click)="deleteDelinquencyRange()"
      *mifosxHasPermission="'DELETE_DELINQUENCY_RANGE'"
    >
      <fa-icon icon="trash" class="m-r-10"></fa-icon>
      {{ 'labels.buttons.Delete' | translate }}
    </button>
  </div>

  <dl class="details">
    <dt>{{ 'labels.inputs.Classification' | translate }}</dt>
    <dd>{{ delinquencyRangeData.classification }}</dd>

    <dt>{{ 'labels.inputs.Days From' | translate }}</dt>
    <dd>{{ delinquencyRangeData.minimumAgeDays }}</dd>

    <dt>{{ 'labels.inputs.Days Till' | translate }}</dt>
    <dd>{{ delinquencyRangeData.maximumAgeDays }}</dd>
  </dl>
</div>
