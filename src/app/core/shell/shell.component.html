<!-- Application Shell -->
@let isHandset = isHandset$ | async;
<!-- The handset drawer always opens in full. -->
@let compact = sidenavCollapsed && !isHandset;
<mat-sidenav-container id="mifosx-shell-container" autosize>
  <!-- Sidenav -->
  <mat-sidenav
    #sidenav
    class="sidebar-panel"
    [ngClass]="{
      'sidebar-full': !compact,
      'sidebar-compact': compact
    }"
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
    (openedChange)="$event && sidenavMenu.revealActive()"
  >
    <mifosx-sidenav
      #sidenavMenu
      [sidenavCollapsed]="compact"
      [overlay]="!!isHandset"
      (navigate)="isHandset && sidenav.close()"
    ></mifosx-sidenav>
  </mat-sidenav>

  <!-- Content -->
  <mat-sidenav-content class="sidenav">
    <!-- Toolbar -->
    <mifosx-toolbar
      [sidenav]="sidenav"
      [sidenavCollapsed]="sidenavCollapsed"
      (collapse)="toggleCollapse($event)"
    ></mifosx-toolbar>
    <!-- Progress Bar -->
    @if (progressBarMode !== 'none') {
      <div>
        <div class="loading"></div>
      </div>
    }

    <!-- Breadcrumb -->
    <mifosx-breadcrumb></mifosx-breadcrumb>
    <!-- Content -->
    <mifosx-content></mifosx-content>
    <!-- Footer -->
    <mifosx-footer [styleClass]="'main-page'"></mifosx-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
