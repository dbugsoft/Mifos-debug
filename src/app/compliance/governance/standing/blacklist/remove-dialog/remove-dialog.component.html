<h2 mat-dialog-title>
  <mat-icon>remove_circle_outline</mat-icon>
  {{ 'elections.TakenOffTheList' | translate }}
  <span class="who-name">· {{ data.listing.name }}</span>
</h2>
<form (ngSubmit)="save()">
  <mat-dialog-content>
    @if (serverError()) {
      <div class="server-error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ serverError() }}</span>
      </div>
    }

    <mifosx-nepali-date-input
      [inline]="true"
      [formControl]="removedOn"
      [label]="'elections.RemovedOn' | translate"
      [minDate]="minDate"
      [maxDate]="today"
    ></mifosx-nepali-date-input>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close>{{ 'labels.buttons.Cancel' | translate }}</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="busy()">
      @if (busy()) {
        <mat-icon class="spin">autorenew</mat-icon>
      }
      {{ 'labels.buttons.Submit' | translate }}
    </button>
  </mat-dialog-actions>
</form>
