@if (compact) {
  <button
    type="button"
    class="language-button"
    [matMenuTriggerFor]="languageMenu"
    [attr.aria-label]="'labels.inputs.Language' | translate"
  >
    <mat-icon>language</mat-icon>
    <span>{{ 'languages.' + currentLanguage | translate }}</span>
    <mat-icon class="chevron">expand_more</mat-icon>
  </button>
  <mat-menu #languageMenu="matMenu" xPosition="before">
    @for (language of languages; track language) {
      <button mat-menu-item (click)="choose(language)">{{ 'languages.' + language | translate }}</button>
    }
  </mat-menu>
} @else {
  <mat-form-field id="language-selector" [appearance]="appearance" [class.outlined-variant]="appearance === 'outline'">
    @if (showLabel) {
      <mat-label>{{ 'labels.inputs.Language' | translate }}</mat-label>
    }
    <mat-select
      [formControl]="languageSelector"
      (selectionChange)="setLanguage()"
      class="languageselector"
      [placeholder]="!showLabel ? ('labels.inputs.Language' | translate) : ''"
    >
      @for (language of languages; track language) {
        <mat-option [value]="language">
          {{ 'languages.' + language | translate }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
}
