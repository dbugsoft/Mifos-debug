<div class="page-header">
  <!-- HEADER LEFT -->

  <a class="header-left" routerLink="/coop/profile" aria-label="Go to cooperative home">
    <div class="header-icon">🏢</div>

    <div>
      <h1>{{ title }}</h1>

      <p>
        {{ subtitle }}
      </p>
    </div>
  </a>

  <!-- NAVIGATION -->

  <nav class="navbar-links">
    <a routerLink="/coop/profile"> Home </a>

    <a routerLink="/coop/profile" [queryParams]="{ view: 'general' }" routerLinkActive="active"> Profile </a>

    <a routerLink="/coop/me" routerLinkActive="active"> Me </a>

    <a routerLink="/coop/account/password" routerLinkActive="active"> Password </a>
  </nav>

  <!-- LOGOUT -->

  <button mat-raised-button type="button" class="logout-button" (click)="logout()">Logout</button>
</div>
