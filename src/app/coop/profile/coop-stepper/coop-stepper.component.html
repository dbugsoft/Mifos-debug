<div class="stepper-shell">
  <!-- =====================================================
       SHARED NAVBAR
       ===================================================== -->

  <mifosx-coop-navbar [title]="currentStep.title" [subtitle]="currentStep.subtitle"> </mifosx-coop-navbar>

  <!-- =====================================================
       CUSTOM STEP INDICATOR
       ===================================================== -->

  <div class="step-indicator-bar">
    <span class="step-indicator-spacer"></span>

    <div class="step-indicator-track">
      <ng-container *ngFor="let step of steps; let i = index; let last = last">
        <button
          type="button"
          class="step-indicator-item"
          [class.is-active]="i === currentStepIndex"
          [class.is-clickable]="i <= currentStepIndex"
          [disabled]="i > currentStepIndex"
          (click)="goToStep(i)"
        >
          <span class="step-indicator-circle">
            {{ i + 1 }}
          </span>

          <span class="step-indicator-label">
            {{ step.label }}
          </span>
        </button>

        <span class="step-indicator-connector" *ngIf="!last"> </span>
      </ng-container>
    </div>

    <!-- Profile status -->

    <span class="status-badge" *ngIf="currentStepIndex === 0 && profileComponent?.profileStatus">
      {{ profileComponent?.profileStatus }}
    </span>
  </div>

  <!-- =====================================================
       MATERIAL STEPPER
       ===================================================== -->

  <mat-stepper #stepper class="coop-profile-stepper" [linear]="true" (selectionChange)="onSelectionChange($event)">
    <!-- ===================================================
         STEP 1 — GENERAL INFORMATION
         =================================================== -->

    <mat-step label="General Information" [completed]="generalInfoCompleted">
      <mifosx-coop-profile (nextStep)="onGeneralInfoNext()"> </mifosx-coop-profile>
    </mat-step>

    <!-- ===================================================
         STEP 2 — DOCUMENTS
         =================================================== -->

    <mat-step label="Documents">
      <mifosx-coop-documents (previousStep)="stepper.previous()"> </mifosx-coop-documents>
    </mat-step>
  </mat-stepper>
</div>
