<h2 mat-dialog-title>{{ 'governanceRegister.documents.AddDocument' | translate }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    @if (serverError()) {
      <p class="server-error">{{ serverError() }}</p>
    }

    <mat-form-field class="field">
      <mat-label>{{ 'governanceRegister.documents.Title' | translate }}</mat-label>
      <input matInput formControlName="title" maxlength="200" />
      @if (form.controls.title.hasError('server')) {
        <mat-error>{{ form.controls.title.getError('server') }}</mat-error>
      }
    </mat-form-field>

    <button mat-stroked-button type="button" (click)="filePicker.click()">
      {{ file()?.name ?? ('governanceRegister.documents.ChooseAFile' | translate) }}
    </button>
    <input #filePicker type="file" hidden accept="application/pdf,image/*" (change)="onFileSelect($event)" />

    <mat-form-field class="field">
      <mat-label>{{ 'labels.inputs.Note' | translate }}</mat-label>
      <textarea matInput formControlName="note" rows="2" maxlength="1000"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" mat-dialog-close>{{ 'labels.buttons.Cancel' | translate }}</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="busy() || !file()">
      {{ 'labels.buttons.Submit' | translate }}
    </button>
  </mat-dialog-actions>
</form>
