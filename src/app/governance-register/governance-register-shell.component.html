<div class="shell">
  <nav mat-tab-nav-bar class="navigation-tabs" [tabPanel]="tabPanel">
    <a
      mat-tab-link
      [routerLink]="['./committees']"
      routerLinkActive
      #committees="routerLinkActive"
      [active]="committees.isActive"
    >
      {{ 'governanceRegister.committees.Committees' | translate }}
    </a>
    <a mat-tab-link [routerLink]="['./people']" routerLinkActive #people="routerLinkActive" [active]="people.isActive">
      {{ 'governanceRegister.people.People' | translate }}
    </a>
    <a
      mat-tab-link
      [routerLink]="['./directors']"
      routerLinkActive
      #directors="routerLinkActive"
      [active]="directors.isActive"
    >
      {{ 'governanceRegister.directors.DirectorsTable' | translate }}
    </a>
    <a
      mat-tab-link
      [routerLink]="['./property-declarations']"
      routerLinkActive
      #declarations="routerLinkActive"
      [active]="declarations.isActive"
    >
      {{ 'governanceRegister.declarations.WhoHasDeclared' | translate }}
    </a>
  </nav>

  <mat-tab-nav-panel #tabPanel class="tab-panel">
    <router-outlet></router-outlet>
  </mat-tab-nav-panel>
</div>
